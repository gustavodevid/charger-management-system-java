server:
  port: 8081

spring:
  application:
    name: charge-proxy

# ASAAS API Configuration (stub for now - will be implemented in iteration 2)
asaas:
  api:
    base-url: ${ASAAS_API_URL:https://sandbox.asaas.com/api/v3}
    access-token: ${ASAAS_ACCESS_TOKEN:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.dac.chargeproxy: DEBUG

