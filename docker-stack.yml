version: '3.8'

services:
  # PostgreSQL Database
  charge-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: chargedb
      POSTGRES_USER: chargeuser
      POSTGRES_PASSWORD: chargepass
    volumes:
      - charge-db-data:/var/lib/postgresql/data
    networks:
      - charge-network
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      placement:
        constraints:
          - node.role == manager

  # Charge Manager - SOAP Service (Tomcat)
  charge-manager:
    image: charge-manager:latest
    environment:
      DB_HOST: charge-db
      DB_PORT: 5432
      DB_NAME: chargedb
      DB_USER: chargeuser
      DB_PASSWORD: chargepass
      CHARGE_PROXY_HOST: charge-proxy
      CHARGE_PROXY_PORT: 8080
      # Mail Configuration (optional)
      MAIL_HOST: smtp.gmail.com
      MAIL_PORT: 587
      MAIL_USERNAME: ""
      MAIL_PASSWORD: ""
      MAIL_FROM_ADDRESS: "noreply@chargemanager.com"
      MAIL_FROM_NAME: "Charge Manager"
    ports:
      - "8080:8080"   # Tomcat (SOAP + Health)
    networks:
      - charge-network
    depends_on:
      - charge-db
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 15s
        max_attempts: 5
      update_config:
        parallelism: 1
        delay: 10s

  # Charge Proxy - SOAP Service (Tomcat)
  charge-proxy:
    image: charge-proxy:latest
    environment:
      ASAAS_API_URL: https://sandbox.asaas.com/api/v3
      ASAAS_ACCESS_TOKEN: "$aact_hmlg_000MzkwODA2MWY2OGM3MWRlMDU2NWM3MzJlNzZmNGZhZGY6OjMxOTBlNzdjLTlkNWEtNDJmMi05ZmFjLTJmYzM0YWFjZDM2MDo6JGFhY2hfNGY2YWRjNWYtZTIzOC00YjIyLTg3YjQtZDZhN2Y0OTFhNjU1"
      ASAAS_API_MODE: "REAL"
      CHARGE_MANAGER_HOST: charge-manager
      CHARGE_MANAGER_PORT: 8080
      WEBHOOK_AUTH_TOKEN: ""
    ports:
      - "8082:8080"   # Tomcat (SOAP + Health + Webhook)
    networks:
      - charge-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 3
      update_config:
        parallelism: 1
        delay: 10s

networks:
  charge-network:
    driver: overlay
    attachable: true

volumes:
  charge-db-data:
    driver: local
