# Charge Manager Configuration

# Database settings (can be overridden by environment variables)
db.host=${DB_HOST:localhost}
db.port=${DB_PORT:5432}
db.name=${DB_NAME:chargedb}
db.username=${DB_USER:chargeuser}
db.password=${DB_PASSWORD:chargepass}

# Connection pool settings
db.pool.maxSize=10
db.pool.minIdle=5
db.pool.idleTimeout=300000
db.pool.connectionTimeout=20000

# Mail settings (can be overridden by environment variables)
mail.host=${MAIL_HOST:smtp.gmail.com}
mail.port=${MAIL_PORT:587}
mail.username=${MAIL_USERNAME:}
mail.password=${MAIL_PASSWORD:}
mail.smtp.auth=true
mail.smtp.starttls.enable=true
mail.from.address=${MAIL_FROM_ADDRESS:noreply@chargemanager.com}
mail.from.name=${MAIL_FROM_NAME:Charge Manager}

# Charge Proxy Client settings
charge.proxy.host=${CHARGE_PROXY_HOST:charge-proxy}
charge.proxy.port=${CHARGE_PROXY_PORT:8080}

# Logging
logging.level.com.dac.chargemanager=DEBUG
