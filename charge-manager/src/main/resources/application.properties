# Charge Manager Configuration
# Note: Environment variables take precedence over these defaults

# Database settings (overridden by DB_HOST, DB_PORT, DB_NAME, DB_USER, DB_PASSWORD env vars)
db.host=localhost
db.port=5432
db.name=chargedb
db.username=chargeuser
db.password=chargepass

# Connection pool settings
db.pool.maxSize=10
db.pool.minIdle=5
db.pool.idleTimeout=300000
db.pool.connectionTimeout=20000

# Mail settings (overridden by MAIL_HOST, MAIL_PORT, MAIL_USERNAME, MAIL_PASSWORD env vars)
mail.host=smtp.gmail.com
mail.port=587
mail.username=
mail.password=
mail.smtp.auth=true
mail.smtp.starttls.enable=true
mail.from.address=noreply@chargemanager.com
mail.from.name=Charge Manager

# Charge Proxy Client settings (overridden by CHARGE_PROXY_HOST, CHARGE_PROXY_PORT env vars)
charge.proxy.host=charge-proxy
charge.proxy.port=8080

# Logging
logging.level.com.dac.chargemanager=DEBUG
